name: USDJPY signal check

on:
  workflow_dispatch:
  schedule:
    # GitHub cron は UTC。JSTの平日 8:00〜24:00 をカバーする。
    - cron: "*/20 23 * * 0-4"
    - cron: "*/20 0-15 * * 1-5"

permissions:
  contents: read

concurrency:
  group: usdjpy-signal-check
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore notification state
        uses: actions/cache@v6
        with:
          path: .signal_state.json
          # run_id を含めることで毎回保存し、restore-keys で直近状態を復元する。
          key: usdjpy-signal-state-${{ github.run_id }}
          restore-keys: |
            usdjpy-signal-state-

      - name: Run unit tests
        run: python -m unittest -v test_main.py

      - name: Analyze USDJPY
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_LOG_WEBHOOK_URL: ${{ secrets.DISCORD_LOG_WEBHOOK_URL }}
          SIGNAL_STATE_FILE: .signal_state.json
          ACCOUNT_BALANCE_JPY: "272778"
          RISK_PERCENT: "3.5"
          EXECUTION_BUFFER_PIPS: "1.0"
          ENTRY_SCORE_THRESHOLD: "80"
          MIN_DIRECTION_SCORE_EDGE: "5"
          NOTIFICATION_COOLDOWN_MINUTES: "180"
        run: python main.py
